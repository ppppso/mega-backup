<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup for MEGA</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{# Loaded before the page renders, so a chosen theme doesn't flash. #}
<script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body>
<header>
  <span class="brand">Backup for MEGA</span>
  <div class="header-end">
  {% if session.auth %}
  <nav>
    <a href="{{ url_for('index') }}" {% if page == 'status' %}aria-current="page"{% endif %}>Status</a>
    <a href="{{ url_for('setup') }}" {% if page == 'setup' %}aria-current="page"{% endif %}>Setup</a>
    <a href="{{ url_for('log_page') }}" {% if page == 'log' %}aria-current="page"{% endif %}>Log</a>
    <form method="post" action="{{ url_for('logout') }}" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="link">Log out</button>
    </form>
  </nav>
  {% endif %}
  <button type="button" class="theme" id="theme-toggle" title="Colour theme">Theme: Auto</button>
  </div>
</header>
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
  <p class="flash {{ cat }}">{{ msg }}</p>
  {% endfor %}
  {% block body %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
