# Push a tag like v1.0.0 to build and publish ghcr.io/<owner>/mega-backup:1.0.0
# for amd64 and arm64. The tests run first, on amd64; nothing is pushed if they fail.
name: Release image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from tag
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $GITHUB_REF_NAME" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for tests (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mega-backup:local

      - name: Tests
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -x -P scripts scripts/*.sh tests/*.sh
          docker run --rm -u 1000:1000 -v "$PWD/tests:/tests:ro" --entrypoint bash \
            mega-backup:local /tests/backup_test.sh
          docker run --rm -u 1000:1000 -v "$PWD/tests:/tests:ro" --entrypoint bash \
            mega-backup:local /tests/pairs_test.sh
          docker run --rm -u 1000:1000 -v "$PWD/tests:/tests:ro" --entrypoint python3 \
            mega-backup:local -I /tests/web_test.py

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Plain image index (no attestation entries), as Umbrel packages expect.
          provenance: false
          sbom: false
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image reference for the Umbrel package
        run: |
          ref="${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}@${{ steps.push.outputs.digest }}"
          docker buildx imagetools inspect "$ref"
          echo "Use in the Umbrel package's docker-compose.yml:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "image: $ref" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
